name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate-databases.yml'
  workflow_dispatch: # Allow manual triggering
    inputs:
      applyProduction:
        description: 'Also apply migrations to Production (requires approval)'
        type: boolean
        required: false
        default: false

jobs:
  # Step 1: Apply migrations to QA automatically
  migrate-qa:
    name: Apply Migrations to QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets (QA)
        id: secrets
        shell: bash
        run: |
          MISSING=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && MISSING+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${{ secrets.SUPABASE_QA_PROJECT_REF }}" ] && MISSING+=("SUPABASE_QA_PROJECT_REF")
          [ -z "${{ secrets.SUPABASE_QA_DB_PASSWORD }}" ] && MISSING+=("SUPABASE_QA_DB_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️ Missing required Supabase QA secrets: ${MISSING[*]}. Skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to QA Supabase
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_QA_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build QA pooler database URL
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        shell: bash
        run: |
          POOLER_URL=$(cat supabase/.temp/pooler-url)
          export POOLER_URL
          DB_URL=$(node -e "const u = new URL(process.env.POOLER_URL); u.password = process.env.SUPABASE_DB_PASSWORD; u.searchParams.set('sslmode', 'require'); u.searchParams.set('connect_timeout', '30'); console.log(u.toString())")
          echo "::add-mask::$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_QA_DB_PASSWORD }}

      - name: Apply migrations to QA
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        shell: bash
        run: |
          run_with_retries() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed. Retrying in $((attempt * 20)) seconds..."
              sleep $((attempt * 20))
            done
            "$@"
          }

          echo "📋 Migrations to apply:"
          run_with_retries supabase migration list --db-url "$SUPABASE_DB_URL"
          echo ""
          echo "🔄 Applying migrations to QA..."
          run_with_retries supabase db push --include-all --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify QA migrations
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          echo "✅ QA Migration Status:"
          supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: QA Testing Instructions
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          echo ""
          echo "✅ Migrations applied to QA successfully!"
          echo "🌐 Test on: https://divij-qa.tech"
          echo ""
          echo "📋 Next Steps:"
          echo "  1. Test the changes on divij-qa.tech"
          echo "  2. Go to GitHub Actions"
          echo "  3. Click 'Review deployments' button"
          echo "  4. Approve 'Production' environment"
          echo "  5. Migrations will apply to production automatically"

      - name: QA Migrations Skipped
        if: ${{ steps.secrets.outputs.skip == 'true' }}
        run: |
          echo "ℹ️ QA migrations skipped because required secrets are missing."

  # Step 2: Apply migrations to Production (requires manual approval via "Review deployments")
  migrate-production:
    name: Apply Migrations to Production
    runs-on: ubuntu-latest
    needs: migrate-qa
    environment:
      name: Production
      url: https://divij.tech
    # Always include production migrations, but approval is required via the Production environment protection rule

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets (Production)
        id: secrets
        shell: bash
        run: |
          MISSING=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && MISSING+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${{ secrets.SUPABASE_PROD_PROJECT_REF }}" ] && MISSING+=("SUPABASE_PROD_PROJECT_REF")
          [ -z "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" ] && MISSING+=("SUPABASE_PROD_DB_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️ Missing required Supabase Production secrets: ${MISSING[*]}. Skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Production Supabase
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build Production pooler database URL
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        shell: bash
        run: |
          POOLER_URL=$(cat supabase/.temp/pooler-url)
          export POOLER_URL
          DB_URL=$(node -e "const u = new URL(process.env.POOLER_URL); u.password = process.env.SUPABASE_DB_PASSWORD; u.searchParams.set('sslmode', 'require'); u.searchParams.set('connect_timeout', '30'); console.log(u.toString())")
          echo "::add-mask::$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: Apply migrations to Production
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        shell: bash
        run: |
          run_with_retries() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed. Retrying in $((attempt * 20)) seconds..."
              sleep $((attempt * 20))
            done
            "$@"
          }

          echo "📋 Migrations to apply:"
          run_with_retries supabase migration list --db-url "$SUPABASE_DB_URL"
          echo ""
          echo "🚀 Applying migrations to PRODUCTION..."
          run_with_retries supabase db push --include-all --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Production migrations
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          echo "✅ Production Migration Status:"
          supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        if: ${{ steps.secrets.outputs.skip != 'true' }}
        run: |
          echo ""
          echo "✅ Migrations applied to PRODUCTION successfully!"
          echo "🌐 Verify on: https://divij.tech"
          echo ""
          echo "📊 Migration complete!"

      - name: Production Migrations Skipped
        if: ${{ steps.secrets.outputs.skip == 'true' }}
        run: |
          echo "ℹ️ Production migrations skipped because required secrets are missing."
